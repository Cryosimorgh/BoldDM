name: Test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: JavaScript syntax
        run: |
          node --check internal/server/web/core.js
          node --check internal/server/web/settings.js
          node --check internal/server/web/events.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/service_worker.js
