<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color-scheme:dark;--bg:#09090b;--panel:#111114;--line:#2b292f;--text:#f2efe8;--muted:#88848b;--gold:#c9a46a;--gold2:#dfbf8b;--green:#7bc69a;--red:#d77878}*{box-sizing:border-box}body{width:330px;margin:0;background:var(--bg);color:var(--text)}.shell{padding:17px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.mark{width:27px;height:27px;border:1px solid #6f593a;border-radius:50%;position:relative}.mark:before{content:"";position:absolute;inset:7px;border:1px solid var(--gold);transform:rotate(45deg)}.mark:after{content:"";position:absolute;width:4px;height:4px;background:var(--gold2);border-radius:50%;right:-2px;top:11px}.brand b{font-size:13px;letter-spacing:.08em}.brand small{display:block;color:#615e64;font-size:8px;letter-spacing:.16em;text-transform:uppercase;margin-top:2px}.status{height:38px;border:1px solid var(--line);background:#0d0d10;border-radius:9px;padding:0 11px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin-bottom:12px}.dot{width:6px;height:6px;border-radius:50%;background:#6d6a70}.status.ok .dot{background:var(--green);box-shadow:0 0 8px rgba(123,198,154,.4)}.status.bad .dot{background:var(--red)}.copy{font-size:11px;line-height:1.55;color:var(--muted);margin:0 0 14px}.primary{width:100%;height:40px;border:1px solid var(--gold);border-radius:9px;background:var(--gold);color:#16110b;font-weight:700;font-size:11px;cursor:pointer;transition:.15s}.primary:hover{background:var(--gold2);border-color:var(--gold2)}.primary:disabled{opacity:.42;cursor:not-allowed}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid #1c1b20;color:#5f5c62;font-size:9px}.foot button{border:0;background:none;color:#8c888e;font-size:9px;padding:0;cursor:pointer}.foot button:hover{color:#d8d3cc}
</style>
</head>
<body>
<div class="shell">
  <div class="brand"><div class="mark"></div><div><b>BOLTDM</b><small>browser companion</small></div></div>
  <div id="health" class="status"><span class="dot"></span><span>Checking BoltDM…</span></div>
  <p class="copy">Choose one download button on this page. BoltDM will find similar buttons, resolve their links, and let you review the downloads before sending them.</p>
  <button id="start" class="primary">Select download button</button>
  <div class="foot"><span>Direct localhost handoff</span><button id="manager">Open BoltDM</button></div>
</div>
<script src="popup.js"></script>
</body>
</html>
